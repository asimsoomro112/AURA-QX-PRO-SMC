<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-QX PRO SMC</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #050505; color: #e0e0e0; overflow: hidden; }
        .glass { background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-glass { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .dropdown-glass { background: #0a0a0a; border: 1px solid #333; max-height: 200px; overflow-y: auto; position: absolute; top: 100%; left: 0; width: 100%; z-index: 50; }
        .dropdown-item { padding: 6px 10px; cursor: pointer; font-size: 11px; color: #aaa; border-bottom: 1px solid #111; }
        .dropdown-item:hover { background: #1a1a1a; color: white; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .btn-active { background: #10b981; color: black; border-color: #10b981; }
        .btn-inactive { background: rgba(255,255,255,0.05); color: #888; }
        .ai-active { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); border-color: #a855f7; color: #d8b4fe; }
        .legend-dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; display: inline-block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- SAFE LOGGING ---
        const originalConsoleError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === 'string' && /defaultProps/.test(args[0])) return;
            originalConsoleError(...args);
        };

        const { useState, useEffect, useRef } = React;
        const { ComposedChart, Bar, XAxis, YAxis, Tooltip, ReferenceArea, ReferenceLine, ReferenceDot, CartesianGrid, Cell, ResponsiveContainer } = window.Recharts;

        // --- 1. COMPONENT DEFINITIONS (Defined BEFORE use) ---
        
        const CandleShape = ({ x, y, width, height, payload }) => {
            const { open, close, high, low, color } = payload;
            const priceRange = high - low;
            if (priceRange === 0) return null;
            const bodyTop = Math.max(open, close), bodyBottom = Math.min(open, close);
            const bodyY = y + ((high - bodyTop) / priceRange) * height;
            const bodyH = Math.max(((bodyTop - bodyBottom) / priceRange) * height, 1);
            const center = x + width / 2;
            return <g><line x1={center} y1={y} x2={center} y2={y + height} stroke={color} strokeWidth={1} /><rect x={x} y={bodyY} width={width} height={bodyH} fill={color} /></g>;
        };

        // Current Price Label (The Green Box)
        const CurrentPriceLabel = ({ viewBox, value }) => {
            const { y, width } = viewBox;
            if (!value || isNaN(value)) return null;
            return (
                <g>
                    <rect x={width} y={y - 10} width={65} height={20} fill="#10b981" rx={2} />
                    <text x={width + 32} y={y + 4} fill="black" textAnchor="middle" fontSize={11} fontWeight="bold" fontFamily="monospace">
                        {Number(value).toFixed(2)}
                    </text>
                </g>
            );
        };

        // Cursor Label (The White Box)
        const CursorLabel = ({ viewBox, value }) => {
            const { y, width } = viewBox;
            if (!value || isNaN(value)) return null;
            return (
                <g>
                    <rect x={width} y={y - 10} width={65} height={20} fill="#333" rx={2} />
                    <text x={width + 32} y={y + 4} fill="white" textAnchor="middle" fontSize={11} fontWeight="bold" fontFamily="monospace">
                        {Number(value).toFixed(2)}
                    </text>
                </g>
            );
        };

        // Zone Label (Sidebar Text for OB/FVG)
        const ZoneLabel = ({ viewBox, zone }) => {
            const { y, height, width } = viewBox;
            if (height < 5) return null;
            return (
                <g>
                    <rect x={width} y={y} width={4} height={height} fill={zone.color} opacity={0.8} />
                    {zone.is_poi && <text x={width+8} y={y+10} fill={zone.color} fontSize={9} fontWeight="bold">POI</text>}
                </g>
            );
        };

        // Tooltip
        const CustomTooltip = ({ active, payload }) => {
            if (active && payload && payload.length) {
                const data = payload[0].payload;
                const col = data.close >= data.open ? 'text-emerald-400' : 'text-red-400';
                return (
                    <div className="bg-[#0a0a0a] border border-zinc-800 p-3 rounded shadow-xl text-xs font-mono z-50 min-w-[140px]">
                        <div className="flex justify-between border-b border-zinc-800 pb-1 mb-2 text-zinc-400"><span>{data.timestamp}</span><span className={col}>{data.close>=data.open?'BULL':'BEAR'}</span></div>
                        <div className="grid grid-cols-2 gap-x-4"><span className="text-zinc-500">O:</span><span className="text-zinc-300">{data.open.toLocaleString()}</span><span className="text-zinc-500">H:</span><span className="text-zinc-300">{data.high.toLocaleString()}</span><span className="text-zinc-500">L:</span><span className="text-zinc-300">{data.low.toLocaleString()}</span><span className="text-zinc-500">C:</span><span className={col}>{data.close.toLocaleString()}</span></div>
                    </div>
                );
            }
            return null;
        };

        // Trading Panel Component
        const TradingPanel = ({ currentPrice, balance, setBalance }) => {
            // Load state from LocalStorage
            const [positions, setPositions] = useState(() => {
                const saved = localStorage.getItem('aura_positions');
                return saved ? JSON.parse(saved) : [];
            });
            const [pendingOrders, setPendingOrders] = useState([]);
            const [orderType, setOrderType] = useState('MARKET');
            const [qty, setQty] = useState(1000);
            const [limitPrice, setLimitPrice] = useState('');
            const [tp, setTp] = useState('');
            const [sl, setSl] = useState('');
            const [activeTab, setActiveTab] = useState('POSITIONS');

            // Save state
            useEffect(() => {
                localStorage.setItem('aura_positions', JSON.stringify(positions));
                localStorage.setItem('aura_balance', balance.toString());
            }, [positions, balance]);

            useEffect(() => { if (orderType === 'LIMIT' && !limitPrice && currentPrice) setLimitPrice(currentPrice.toFixed(2)); }, [orderType, currentPrice]);

            useEffect(() => {
                if (!currentPrice) return;
                // Limit Fills
                const newPositions = [];
                const remainingOrders = pendingOrders.filter(order => {
                    const price = parseFloat(order.limitPrice);
                    let filled = false;
                    if (order.side === 'LONG' && currentPrice <= price) filled = true;
                    else if (order.side === 'SHORT' && currentPrice >= price) filled = true;
                    if (filled) {
                        newPositions.push({ id: Date.now()+Math.random(), type: order.side, entry: price, size: order.size, leverage: order.leverage, tp: order.tp, sl: order.sl, timestamp: new Date().toLocaleTimeString() });
                        return false; 
                    }
                    return true;
                });
                if (newPositions.length > 0) { setPendingOrders(remainingOrders); setPositions(prev => [...prev, ...newPositions]); }

                // TP/SL Checks
                const active = positions.filter(pos => {
                    let close = false;
                    if (pos.sl) { if (pos.type === 'LONG' && currentPrice <= pos.sl) close = true; if (pos.type === 'SHORT' && currentPrice >= pos.sl) close = true; }
                    if (pos.tp && !close) { if (pos.type === 'LONG' && currentPrice >= pos.tp) close = true; if (pos.type === 'SHORT' && currentPrice <= pos.tp) close = true; }
                    if (close) {
                        const diff = pos.type === 'LONG' ? currentPrice - pos.entry : pos.entry - currentPrice;
                        const pnl = (diff / pos.entry) * pos.size * pos.leverage;
                        setBalance(prev => prev + pos.size + pnl);
                        return false;
                    }
                    return true;
                });
                if (active.length !== positions.length) setPositions(active);
            }, [currentPrice]);

            const equity = positions.reduce((acc, pos) => {
                if (!currentPrice) return acc;
                const diff = pos.type === 'LONG' ? currentPrice - pos.entry : pos.entry - currentPrice;
                return acc + ((diff / pos.entry) * pos.size * pos.leverage);
            }, balance);

            const handleTrade = (side) => {
                const sizeVal = parseFloat(qty);
                if (balance < sizeVal) return alert("Insufficient Balance");
                if (orderType === 'LIMIT' && !limitPrice) return alert("Enter Limit Price");
                const tradeData = { id: Date.now(), side, size: sizeVal, leverage: 5, tp: tp?parseFloat(tp):null, sl: sl?parseFloat(sl):null, timestamp: new Date().toLocaleTimeString() };
                setBalance(prev => prev - sizeVal);
                if (orderType === 'MARKET') setPositions(prev => [...prev, { ...tradeData, type: side, entry: currentPrice }]);
                else setPendingOrders(prev => [...prev, { ...tradeData, limitPrice: parseFloat(limitPrice) }]);
            };

            const closePosition = (id) => {
                const pos = positions.find(p => p.id === id);
                if (!pos || !currentPrice) return;
                const diff = pos.type === 'LONG' ? currentPrice - pos.entry : pos.entry - currentPrice;
                const pnl = (diff / pos.entry) * pos.size * pos.leverage;
                setBalance(prev => prev + pos.size + pnl);
                setPositions(prev => prev.filter(p => p.id !== id));
            };

            const cancelOrder = (id) => { const order = pendingOrders.find(o => o.id === id); setBalance(prev => prev + order.size); setPendingOrders(prev => prev.filter(o => o.id !== id)); };

            return (
                <div className="glass p-3 rounded border-b border-white/5 flex flex-col gap-3 mb-2 flex-shrink-0">
                    <div className="flex justify-between items-center border-b border-white/10 pb-2"><div><div className="text-[9px] text-zinc-500">EQUITY</div><div className={`text-lg font-bold font-mono ${equity >= 10000 ? 'text-emerald-400' : 'text-red-400'}`}>${equity.toLocaleString(undefined, {maximumFractionDigits: 2})}</div></div><div className="text-right"><div className="text-[9px] text-zinc-500">AVAIL</div><div className="text-xs font-mono text-white">${balance.toLocaleString(undefined, {maximumFractionDigits: 2})}</div></div></div>
                    <div className="flex flex-col gap-2"><div className="flex gap-2"><div className="flex bg-black/40 rounded p-0.5 border border-white/5"><button onClick={()=>setOrderType('MARKET')} className={`text-[9px] px-2 py-1 rounded ${orderType==='MARKET'?'bg-zinc-700 text-white':'text-zinc-500'}`}>MKT</button><button onClick={()=>setOrderType('LIMIT')} className={`text-[9px] px-2 py-1 rounded ${orderType==='LIMIT'?'bg-zinc-700 text-white':'text-zinc-500'}`}>LIM</button></div><input type="number" placeholder="Qty" value={qty} onChange={e=>setQty(e.target.value)} className="input-glass text-xs p-1 rounded flex-1 w-full" /></div>{orderType === 'LIMIT' && <input type="number" placeholder="Price" value={limitPrice} onChange={e=>setLimitPrice(e.target.value)} className="input-glass text-xs p-1 rounded w-full border-yellow-500/50" />}<div className="grid grid-cols-2 gap-2"><input type="number" placeholder="TP" value={tp} onChange={e=>setTp(e.target.value)} className="input-glass text-xs p-1 rounded text-emerald-400" /><input type="number" placeholder="SL" value={sl} onChange={e=>setSl(e.target.value)} className="input-glass text-xs p-1 rounded text-red-400" /></div><div className="grid grid-cols-2 gap-2"><button onClick={() => handleTrade('LONG')} className="bg-emerald-600 hover:bg-emerald-500 text-white py-1.5 rounded text-xs font-bold">LONG</button><button onClick={() => handleTrade('SHORT')} className="bg-red-600 hover:bg-red-500 text-white py-1.5 rounded text-xs font-bold">SHORT</button></div></div>
                    <div className="flex gap-4 border-b border-white/5 text-[9px] text-zinc-500 pb-1 mt-1"><button onClick={()=>setActiveTab('POSITIONS')} className={`hover:text-white ${activeTab==='POSITIONS'?'text-white font-bold':''}`}>POS ({positions.length})</button><button onClick={()=>setActiveTab('ORDERS')} className={`hover:text-white ${activeTab==='ORDERS'?'text-white font-bold':''}`}>ORD ({pendingOrders.length})</button></div>
                    <div className="overflow-y-auto max-h-[120px] pr-1 custom-scroll space-y-1">{activeTab === 'POSITIONS' ? (positions.length === 0 ? <div className="text-center text-[9px] text-zinc-700 py-2">Empty</div> : positions.map(pos => {
                        const diff = pos.type === 'LONG' ? currentPrice - pos.entry : pos.entry - currentPrice;
                        const pnl = (diff / pos.entry) * pos.size * pos.leverage;
                        return <div key={pos.id} className="bg-white/5 p-2 rounded flex justify-between items-center text-[9px] border border-white/5"><div><div className={`font-bold ${pos.type==='LONG'?'text-emerald-500':'text-red-500'}`}>{pos.type} 5x</div><div className="text-zinc-500">@ {pos.entry.toFixed(2)}</div></div><div className="text-right"><div className={`font-mono font-bold ${pnl>=0?'text-emerald-400':'text-red-400'}`}>{pnl>=0?'+':''}{pnl.toFixed(2)}</div><button onClick={()=>closePosition(pos.id)} className="text-[8px] bg-zinc-800 px-1.5 py-0.5 rounded mt-1 hover:bg-zinc-700">CLOSE</button></div></div>
                    })) : (pendingOrders.length === 0 ? <div className="text-center text-[9px] text-zinc-700 py-2">Empty</div> : pendingOrders.map(ord => (<div key={ord.id} className="bg-white/5 p-2 rounded flex justify-between items-center text-[9px] border border-dashed border-zinc-700"><div><div className={`font-bold ${ord.side==='LONG'?'text-emerald-500':'text-red-500'}`}>{ord.side}</div><div className="text-yellow-500">@ {ord.limitPrice}</div></div><button onClick={()=>cancelOrder(ord.id)} className="text-zinc-500 hover:text-white">✕</button></div>)))}</div>
                </div>
            );
        };

        // --- 7. MAIN DASHBOARD ---
        const SMCDashboard = () => {
            const [market, setMarket] = useState(null);
            const [status, setStatus] = useState("INIT");
            const [symbol, setSymbol] = useState("BTC");
            const [symbolList, setSymbolList] = useState([]);
            const [filteredSymbols, setFilteredSymbols] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);
            const [selectedTFs, setSelectedTFs] = useState(["1h", "4h"]);
            const [cursorPrice, setCursorPrice] = useState(null);
            
            const [showLiquidity, setShowLiquidity] = useState(true);
            const [aiMode, setAiMode] = useState(false);
            
            // Balance with Auto-Load
            const [balance, setBalance] = useState(() => {
                const saved = localStorage.getItem('aura_balance');
                return saved ? parseFloat(saved) : 10000;
            });

            const wsRef = useRef(null);
            const chartContainerRef = useRef(null);
            const availableTFs = ["15m", "30m", "1h", "4h", "1d"];

            // Polling Logic for Vercel
            useEffect(() => {
                const fetchData = async () => {
                    setStatus("SCANNING");
                    try {
                        let cleanSymbol = symbol.toUpperCase();
                        if(!cleanSymbol.includes("/")) cleanSymbol += "/USDT";
                        
                        // Use fetch instead of websocket for Vercel backend
                        const res = await fetch(`/api/scan?symbol=${cleanSymbol}&timeframe=1h&ai_mode=${aiMode}`);
                        const data = await res.json();
                        
                        if(data.error) setStatus("RETRYING");
                        else {
                            setMarket(data);
                            setStatus("LIVE");
                        }
                    } catch(e) { setStatus("RETRYING"); }
                };
                
                fetchData();
                const interval = setInterval(fetchData, 4000); 
                return () => clearInterval(interval);
            }, [symbol, aiMode]);

            // Mock Symbols list for search (Since we can't websocket stream it instantly in serverless)
            useEffect(() => {
                setSymbolList(["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "BNB/USDT", "ADA/USDT", "DOGE/USDT", "AVAX/USDT", "LINK/USDT", "PEPE/USDT", "WIF/USDT"]);
            }, []);

            useEffect(() => { if(symbol) setFilteredSymbols(symbolList.filter(s=>s.includes(symbol.toUpperCase())).slice(0,50)); }, [symbol, symbolList]);

            const selectSymbol = (s) => { setSymbol(s.split('/')[0]); setShowDropdown(false); };
            const handleScan = () => { /* logic is handled by useEffect on symbol change */ };
            const toggleAi = () => setAiMode(!aiMode);
            const toggleTF = (tf) => { const newTfs = selectedTFs.includes(tf) ? (selectedTFs.length > 1 ? selectedTFs.filter(t => t !== tf) : selectedTFs) : [...selectedTFs, tf]; setSelectedTFs(newTfs); };

            if (!market) return <div className="h-screen flex flex-col items-center justify-center bg-[#050505]"><div className="text-emerald-500 animate-pulse text-2xl font-bold">AURA-QX VERCEL</div><div className="text-zinc-500 text-xs mt-2">{status}...</div></div>;

            const candles = market.candles || [];
            const chartData = candles.map(c => ({ ...c, range:[c.low, c.high], color: c.close>=c.open?'#10b981':'#ef4444' }));
            let minPrice=0, maxPrice=100;
            if(candles.length) { const l=candles.map(c=>c.low), h=candles.map(c=>c.high); minPrice=Math.min(...l)*0.999; maxPrice=Math.max(...h)*1.001; }

            const handleMouseMove = (e) => {
                if(e?.chartY && chartContainerRef.current) {
                    const h = chartContainerRef.current.clientHeight - 30; 
                    const p = e.chartY - 15; 
                    if(h>0 && isFinite(maxPrice)) setCursorPrice(maxPrice - (p/h)*(maxPrice-minPrice));
                }
            };

            return (
                <div className="h-screen flex flex-col bg-[#050505] p-3 text-sm font-sans">
                    <div className="glass p-4 rounded mb-3 flex flex-wrap gap-6 justify-between items-center z-50 relative">
                        <div className="flex items-center gap-6"><div className="flex flex-col flex-shrink-0"><span className="font-bold text-emerald-500 tracking-wider text-lg">AURA-QX</span><span className="text-[10px] text-zinc-500">PRO TERMINAL</span></div><div className="h-10 w-[1px] bg-white/10"></div><div className="relative"><span className="text-[10px] text-zinc-400 block mb-1">ASSET PAIR</span><input type="text" value={symbol} onFocus={()=>setShowDropdown(true)} onChange={e=>{setSymbol(e.target.value.toUpperCase()); setShowDropdown(true)}} className="input-glass px-3 py-1.5 rounded w-40 text-sm font-mono outline-none focus:border-emerald-500" />{showDropdown && filteredSymbols.length>0 && <div className="dropdown-glass rounded shadow-xl mt-1">{filteredSymbols.map(s=><div key={s} onClick={()=>{selectSymbol(s)}} className="dropdown-item">{s}</div>)}</div>}</div></div>
                        <div className="flex items-center gap-3"><span className="text-[10px] text-zinc-400">TIMEFRAMES</span><div className="flex bg-black/50 rounded p-1.5 gap-1">{availableTFs.map(tf => (<button key={tf} onClick={() => toggleTF(tf)} className={`text-xs px-3 py-1.5 rounded font-bold transition-colors ${selectedTFs.includes(tf) ? 'btn-active' : 'btn-inactive hover:bg-white/10'}`}>{tf}</button>))}</div></div>
                        <div className="flex items-center gap-4"><div className="flex flex-col"><span className="text-[10px] text-zinc-400 mb-1">VISUALS</span><div className="flex gap-2"><button onClick={()=>setShowLiquidity(!showLiquidity)} className={`px-3 py-1 rounded text-[10px] font-bold border transition-all ${showLiquidity ? 'bg-yellow-500/10 border-yellow-500 text-yellow-500' : 'border-zinc-700 text-zinc-500 hover:bg-zinc-800'}`}>LIQ</button><button onClick={toggleAi} className={`px-3 py-1 rounded text-[10px] font-bold border transition-all flex items-center gap-1 ${aiMode ? 'bg-purple-600/20 border-purple-500 text-purple-300 shadow-[0_0_10px_rgba(168,85,247,0.3)]' : 'border-zinc-700 text-zinc-500 hover:bg-zinc-800'}`}>AI</button></div></div></div>
                        <div className="flex items-center gap-6"><div className="text-right border-l border-white/10 pl-6"><div className="text-3xl font-bold text-white tracking-tighter">${market.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</div><div className={`text-[9px] font-mono text-center px-1 rounded mt-1 ${market.is_simulation ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}`}>{market.is_simulation ? 'DATA: SIMULATED' : 'DATA: LIVE BINANCE'}</div></div></div>
                    </div>

                    <div className="flex-1 grid grid-cols-12 gap-3 overflow-hidden">
                        <div className="col-span-10 glass rounded relative flex flex-col min-h-0 p-2" ref={chartContainerRef}>
                            <div className="absolute top-4 left-4 z-10 flex gap-3 text-[10px] font-mono pointer-events-none opacity-90"><span className="bg-blue-900/40 text-blue-200 px-3 py-1 rounded border border-blue-500/20"><span className="legend-dot bg-blue-500"></span>OB</span><span className="bg-yellow-900/40 text-yellow-200 px-3 py-1 rounded border border-yellow-500/20"><span className="legend-dot bg-yellow-500"></span>FVG</span><span className="bg-white/10 text-white px-3 py-1 rounded border border-white/10">LIQUIDITY</span></div>
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={chartData} margin={{top:15, right:80, left:0, bottom:0}} onMouseMove={handleMouseMove} onMouseLeave={()=>setCursorPrice(null)}>
                                    <CartesianGrid stroke="#151515" vertical={false} strokeDasharray="3 3" />
                                    <XAxis dataKey="timestamp" hide />
                                    <YAxis domain={[minPrice, maxPrice]} orientation="right" tick={{fill:'#666', fontSize:11, fontFamily:'monospace'}} tickFormatter={(v)=>v.toFixed(2)} stroke="#222" width={70} />
                                    <Tooltip content={<CustomTooltip />} cursor={{stroke:'#fff', strokeWidth:1, strokeOpacity:0.2, strokeDasharray:'4 4'}} />
                                    
                                    {showLiquidity && (market.heatmap || []).map((l, i) => (
                                        <ReferenceLine 
                                            key={`h${i}`} 
                                            y={l.price} 
                                            stroke={l.color} 
                                            strokeOpacity={l.type.includes('WALL')?0.8:0.3} 
                                            strokeWidth={l.type.includes('WALL')?2:1} 
                                            strokeDasharray={l.type.includes('WALL')?'':'4 4'}
                                            label={l.type.includes('WALL') ? { position: 'insideTopLeft', value: l.type, fill: l.color, fontSize: 10, fontWeight: 'bold' } : ''}
                                        />
                                    ))}

                                    {(market.zones || []).map((z, i) => (<ReferenceArea key={`z${i}`} y1={z.bottom} y2={z.top} fill={z.color} fillOpacity={z.opacity} stroke={z.color} strokeOpacity={0.4} label={(props) => <ZoneLabel {...props} zone={z} />} />))}
                                    
                                    {(market.structure || []).map((s, i) => (
                                        <ReferenceDot 
                                            key={`s${i}`} 
                                            x={s.timestamp} 
                                            y={s.price} 
                                            r={3} 
                                            fill={s.color} 
                                            stroke="#fff"
                                            strokeWidth={1}
                                            label={{ position: 'top', value: s.type, fill: s.color, fontSize: 10, fontWeight: 'bold', dy: -5 }} 
                                        />
                                    ))}
                                    
                                    {cursorPrice && <ReferenceLine y={cursorPrice} stroke="#ffffff" strokeDasharray="2 2" strokeOpacity={0.5} label={(props) => <CursorLabel {...props} value={cursorPrice} />} />}
                                    
                                    <ReferenceLine y={market.price} stroke="#10b981" strokeWidth={1} strokeDasharray="4 2" label={(props) => <CurrentPriceLabel {...props} value={market.price} />} />

                                    <Bar dataKey="range" shape={<CandleShape />} isAnimationActive={false} activeBar={false} />
                                </ComposedChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="col-span-2 flex flex-col gap-3 min-h-0">
                            <TradingPanel currentPrice={market.price} balance={balance} setBalance={setBalance} />
                            
                            <div className={`glass p-4 rounded border-l-4 flex-shrink-0 transition-all ${aiMode ? 'border-purple-500 ai-active' : 'border-emerald-500'}`}>
                                <div className="flex justify-between mb-2"><span className={`text-xs font-bold tracking-widest ${aiMode ? 'text-purple-400' : 'text-zinc-500'}`}>{aiMode ? 'AI ANALYST ACTIVE' : 'SIGNAL ENGINE'}</span>{aiMode && <span className="animate-pulse text-[10px] text-purple-500">PROCESSING...</span>}</div>
                                {market.signal ? (<div className="animate-in fade-in"><div className="flex justify-between items-center mb-2"><h2 className="text-white font-bold text-sm">{market.signal.type}</h2><span className="bg-emerald-500 text-black text-[10px] font-bold px-2 py-0.5 rounded">{market.signal.confidence}% CONF</span></div><p className="text-xs text-zinc-300 mb-3 leading-relaxed border-b border-white/5 pb-3">{aiMode && market.ai_narrative ? market.ai_narrative : market.signal.reason}</p><div className="grid grid-cols-2 gap-2 text-xs font-mono"><div className="bg-white/5 px-2 py-1.5 rounded text-white flex justify-between"><span>ENT</span> <span>{market.signal.entry.toFixed(2)}</span></div><div className="bg-red-500/10 px-2 py-1.5 rounded text-red-400 flex justify-between"><span>SL</span> <span>{market.signal.stop.toFixed(2)}</span></div><div className="col-span-2 bg-emerald-500/10 px-2 py-1.5 rounded text-emerald-400 flex justify-between"><span>TARGET</span> <span>{market.signal.target.toFixed(2)}</span></div></div></div>) : (<div className="py-6 text-center text-xs text-zinc-500 italic">{aiMode ? (market.ai_narrative || "AI Scanning Market Structure...") : "Scanning... No Valid Setup."}</div>)}
                            </div>
                            <div className="glass p-3 rounded flex-1 overflow-y-auto min-h-0 flex flex-col"><div className="text-xs text-zinc-500 font-bold mb-3 sticky top-0 bg-[#0a0a0a] py-1 border-b border-white/5">ACTIVE P.O.I & ZONES</div><div className="space-y-2 overflow-y-auto pr-1 custom-scroll flex-1">{(market.zones || []).slice().reverse().map((zone, i) => (<div key={i} className={`text-xs p-3 rounded border flex flex-col gap-1 hover:bg-white/5 ${zone.is_poi ? 'border-emerald-500/50 bg-emerald-500/05' : 'border-white/5 bg-white/05'}`}><div className="flex justify-between font-bold items-center" style={{color: zone.color}}><span>{zone.type}</span>{zone.is_poi && <span className="text-[9px] bg-emerald-500 text-black px-1 rounded">POI</span>}</div><div className="flex justify-between text-zinc-400 font-mono text-[11px] bg-black/20 p-1 rounded"><span>{zone.bottom.toFixed(2)}</span><span className="text-zinc-600">-</span><span>{zone.top.toFixed(2)}</span></div></div>))}</div></div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SMCDashboard />);
    </script>
</body>
</html>
